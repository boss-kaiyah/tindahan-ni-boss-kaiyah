<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boss Kaiyah - Purple Affiliate</title>
<style>
:root{--bg:#0a0420;--card:#16102e;--purple:#a855f7;--pink:#e879f9;--border:#2a1a4a}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:#fff;font-family:Inter,Arial,sans-serif}
#logo{text-align:center;padding:18px 10px;font-size:28px;font-weight:900;letter-spacing:1px;background:linear-gradient(90deg,var(--purple),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;user-select:none;cursor:pointer}
#logo small{display:block;font-size:10px;color:#c084fc;-webkit-text-fill-color:#c084fc;font-weight:700;letter-spacing:3px}
.filter{display:flex;gap:8px;padding:12px;overflow-x:auto;scrollbar-width:none}
.filter::-webkit-scrollbar{display:none}
.filter button{flex:0 0 auto;background:var(--card);color:#c084fc;border:1px solid var(--purple);padding:9px 16px;border-radius:24px;font-weight:800;font-size:12px}
.filter button.active{background:linear-gradient(90deg,var(--purple),var(--pink));color:#fff;border-color:transparent;box-shadow:0 0 12px var(--purple)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:10px;position:relative;overflow:hidden}
.card.red{border:2px solid #ff0033;box-shadow:0 0 12px #ff0033}
.card img{width:100%;height:150px;object-fit:cover;border-radius:12px;background:#0f0828}
.badge{position:absolute;top:10px;left:10px;background:#ff0033;color:#fff;font-size:9px;padding:3px 7px;border-radius:10px;font-weight:900;display:none}
.card.red.badge{display:block}
.card h4{margin:8px 0 2px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card p{margin:0;color:#9ca3af;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{color:#f5d0fe;font-weight:900;margin:6px 0;font-size:14px}
.buy{display:block;text-align:center;background:linear-gradient(90deg,var(--purple),var(--pink));color:#fff;text-decoration:none;padding:10px;border-radius:10px;font-weight:900;font-size:12px;margin-top:6px}
.cat{font-size:9px;color:#c084fc;border:1px solid #2a1a4a;display:inline-block;padding:2px 6px;border-radius:10px;margin-top:4px}
/* ADMIN - SARILI NATING SPREADSHEET */
#admin{display:none;margin:12px;background:#0f0828;border:2px solid var(--purple);border-radius:18px;padding:14px;box-shadow:0 0 20px rgba(168,85,247,.4)}
#admin h3{margin:0 0 10px;background:linear-gradient(90deg,var(--purple),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.inp{width:100%;padding:10px;border-radius:10px;border:1px solid #2a1a4a;background:#16102e;color:#fff;margin:4px 0;font-size:12px}
.btn{width:100%;background:linear-gradient(90deg,var(--purple),var(--pink));color:#fff;border:0;padding:12px;border-radius:12px;font-weight:900;margin:6px 0}
.btn-red{background:#ff0033;background-image:none}
table{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}
th{background:#1a1038;padding:8px;text-align:left;color:#c084fc;position:sticky;top:0}
td{border-bottom:1px solid #1e153d;padding:6px;vertical-align:middle}
td[contenteditable]{background:#16102e;outline:1px solid var(--purple)}
.sheet-img{width:36px;height:36px;border-radius:6px;object-fit:cover}
</style>
</head>
<body>

<div id="logo">💜 BOSS KAIYAH<small>TAP 10X FOR SECRET SHEET</small></div>

<div class="filter" id="filterBar">
<button class="active" onclick="filterCat('all',this)">ALL ✨</button>
<button onclick="filterCat('Home Essentials',this)">🏠 Home</button>
<button onclick="filterCat('Gadgets',this)">🔌 Gadgets</button>
<button onclick="filterCat('Fashion',this)">👗 Fashion</button>
<button onclick="filterCat('Beauty',this)">💄 Beauty</button>
</div>

<div class="grid" id="grid"></div>

<!-- SARILI NATING SPREADSHEET ADMIN -->
<div id="admin">
<h3>🔑 MY SPREADSHEET - Sarili Natin (Purple)</h3>
<input id="f_link" class="inp" placeholder="Affiliate Link - s.shopee.com.ph/...">
<input id="f_img" class="inp" placeholder="Image Link - https://...jpg">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
<input id="f_brand" class="inp" placeholder="Brand">
<input id="f_price" class="inp" placeholder="Price - 599">
</div>
<input id="f_desc" class="inp" placeholder="Description - Short only">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
<input id="f_cat" class="inp" placeholder="Category - Home Essentials" list="cats">
<datalist id="cats"><option value="Home Essentials"><option value="Gadgets"><option value="Fashion"><option value="Beauty"></datalist>
<input id="f_rate" class="inp" placeholder="Rate - 4.9 (optional)">
</div>
<button class="btn" onclick="addRow()">+ ADD ROW TO MY SHEET</button>

<div style="overflow-x:auto;max-height:320px;overflow-y:auto;border:1px solid #2a1a4a;border-radius:10px">
<table id="sheet"><thead><tr><th>Img</th><th>Brand/Price</th><th>Cat</th><th>Status</th><th>X</th></tr></thead><tbody></tbody></table>
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
<button class="btn" style="background:#1a1038;border:1px solid var(--purple)" onclick="exportData()">⬇️ Export</button>
<button class="btn" style="background:#1a1038;border:1px solid var(--purple)" onclick="document.getElementById('importFile').click()">⬆️ Import</button>
</div>
<input type="file" id="importFile" hidden onchange="importData(event)">
<div style="font-size:10px;color:#6b7280;margin-top:8px">💡 Click cell to edit parang Excel. Auto-save. 🟢 OK / 🔴 EXPIRED auto-detect.</div>
<button class="btn btn-red" onclick="closeAdmin()">CLOSE ADMIN</button>
</div>

<script>
let products = JSON.parse(localStorage.getItem('boss_kaiyah_sheet')||'[]');

// 10 TAP LOGO + PASSWORD
let taps=0, timer;
const logoEl=document.getElementById('logo');
logoEl.addEventListener('click',()=>{
  taps++; clearTimeout(timer); timer=setTimeout(()=>taps=0,2000);
  if(taps>=10){
    let p=prompt('🔑 Enter Password:');
    if(p==='kaiyah123'){ document.getElementById('admin').style.display='block'; renderSheet(); window.scrollTo(0,0); }
    else alert('❌ Wrong password!'); taps=0;
  }
});
function closeAdmin(){ document.getElementById('admin').style.display='none'; renderGrid(currentCat); }
let currentCat='all';

function addRow(){
  if(!f_link.value ||!f_img.value) return alert('Link at Image required Parekoy!');
  products.push({id:Date.now(), link:f_link.value.trim(), img:f_img.value.trim(), brand:f_brand.value.trim()||'No Brand', desc:f_desc.value.trim(), price:f_price.value.trim()||'0', cat:f_cat.value.trim()||'Home Essentials', rate:f_rate.value.trim()||'4.9'});
  localStorage.setItem('boss_kaiyah_sheet',JSON.stringify(products));
  f_link.value=f_img.value=f_brand.value=f_desc.value=f_price.value=f_cat.value=f_rate.value=''; renderSheet(); renderGrid(currentCat);
}
function delRow(id){ if(confirm('Delete this row?')){ products=products.filter(p=>p.id!=id); localStorage.setItem('boss_kaiyah_sheet',JSON.stringify(products)); renderSheet(); renderGrid(currentCat); }}
function editCell(id,key,el){ let v=el.innerText.trim(); let p=products.find(x=>x.id==id); if(p){ p[key]=v; localStorage.setItem('boss_kaiyah_sheet',JSON.stringify(products)); renderGrid(currentCat); }}

function renderSheet(){
  const tbody=document.querySelector('#sheet tbody');
  tbody.innerHTML = products.map(p=>`
    <tr>
      <td><img src="${p.img}" class="sheet-img" onerror="this.style.border='2px solid red'"></td>
      <td><div contenteditable onblur="editCell(${p.id},'brand',this)" style="font-weight:800">${p.brand}</div><div contenteditable onblur="editCell(${p.id},'price',this)" style="color:#f5d0fe">₱${p.price}</div></td>
      <td contenteditable onblur="editCell(${p.id},'cat',this)">${p.cat}</td>
      <td id="st-${p.id}">Checking...</td>
      <td><button onclick="delRow(${p.id})" style="background:#ff0033;color:#fff;border:0;padding:5px 8px;border-radius:6px">X</button></td>
    </tr>`).join('') || '<tr><td colspan=5 style="text-align:center;padding:20px;color:#666">Wala pa laman - Add ka muna</td></tr>';
  products.forEach(p=>{ let img=new Image(); img.onload=()=>{ let e=document.getElementById('st-'+p.id); if(e) e.innerHTML='🟢 OK'; }; img.onerror=()=>{ let e=document.getElementById('st-'+p.id); if(e) e.innerHTML='🔴 EXPIRED'; }; img.src=p.img; });
}

function renderGrid(filter='all'){
  currentCat=filter;
  let list = filter==='all'?products:products.filter(p=>p.cat===filter);
  document.getElementById('grid').innerHTML = list.map(p=>`
    <div class="card" id="card-${p.id}">
      <span class="badge">EXPIRED</span>
      <img src="${p.img}" loading="lazy" onerror="this.closest('.card').classList.add('red')">
      <h4>${p.brand}</h4><p>${p.desc||p.cat}</p>
      <div class="price">₱${p.price} <small style="color:#c084fc">★${p.rate}</small></div>
      <span class="cat">${p.cat}</span>
      <a href="${p.link}" target="_blank" class="buy">BUY NOW 🛒</a>
    </div>`).join('') || `<div style="grid-column:1/3;text-align:center;padding:40px;color:#6b7280"><div style="font-size:40px">📦</div>Wala pa laman sa ${filter}<br><small style="color:#c084fc">Tap logo 10x → Add products</small></div>`;
}
function filterCat(c,btn){ document.querySelectorAll('.filter button').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); renderGrid(c); }

function exportData(){ let data=JSON.stringify(products); let a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:'application/json'})); a.download='boss-kaiyah-backup.json'; a.click(); }
function importData(e){ let r=new FileReader(); r.onload=()=>{ try{ let d=JSON.parse(r.result); if(Array.isArray(d)){ products=d; localStorage.setItem('boss_kaiyah_sheet',JSON.stringify(products)); renderSheet(); renderGrid(currentCat); alert('✅ Imported '+d.length+' products!'); } }catch{ alert('Invalid file'); } }; r.readAsText(e.target.files[0]); }

renderGrid();
</script>
</body>
</html>
