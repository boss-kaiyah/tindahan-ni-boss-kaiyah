<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tindahan ni Boss Kaiyah - FINAL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0b0218;color:#fff}
.h{background:#1a0b2e;padding:15px;text-align:center;border-bottom:3px solid #a855f7}
.h h1{color:#d8b4fe}
.box{background:#1e1035;margin:12px;padding:12px;border-radius:12px;border:2px dashed #a855f7}
input{width:100%;padding:11px;margin:5px 0;border-radius:8px;border:1px solid #a855f7;background:#0f041f;color:#fff}
button{width:100%;padding:12px;background:linear-gradient(90deg,#a855f7,#ec4899);border:0;border-radius:10px;color:#fff;font-weight:900;cursor:pointer;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:12px}
.card{background:#14082a;border:1px solid #3b2a6b;border-radius:12px;overflow:hidden}
.card img{width:100%;height:140px;object-fit:cover}
.card div{padding:8px}
.pr{color:#facc15;font-weight:900;font-size:18px}
.buy{display:block;margin-top:6px;padding:8px;background:#f97316;color:#fff;text-align:center;border-radius:8px;text-decoration:none;font-weight:900}
</style>
</head>
<body>
<div class="h">
<h1>💜 Tindahan ni Boss Kaiyah - UNLI FINAL</h1>
<p style="color:#c4b5fd;font-size:12px">Paste mo lang - UNLI products na!</p>
</div>

<div class="box">
<h3 style="color:#d8b4fe">📦 ADD PRODUCT (2 SECONDS LANG!)</h3>
<input id="name" placeholder="Name: ex Logitech G203">
<input id="price" placeholder="Price: ex 1099">
<input id="img" placeholder="Image Link: (right click image sa Shopee > Copy Image Link)">
<input id="link" placeholder="Affiliate Link mo: s.shopee.com.ph/xxxx - DITO KITA 3.5%">
<button onclick="add()">+ ADD TO STORE</button>
<p style="font-size:10px;color:#888;margin-top:6px">Paano kunin image: Open Shopee product > Right click sa picture > Copy Image Address > Paste dito</p>
</div>

<div id="grid" class="grid"></div>

<script>
let p=JSON.parse(localStorage.getItem('kaiyah_final2')||'[]');
function save(){localStorage.setItem('kaiyah_final2',JSON.stringify(p));render()}
function add(){
 const n=document.getElementById('name').value;
 const pr=document.getElementById('price').value;
 const im=document.getElementById('img').value;
 const li=document.getElementById('link').value;
 if(!n||!pr||!li){alert('Lagay mo name, price, at affiliate link Parekoy!');return}
 p.unshift({name:n,price:pr,image:im||'https://via.placeholder.com/300/a855f7/fff?text='+encodeURIComponent(n),link:li});
 document.getElementById('name').value='';document.getElementById('price').value='';document.getElementById('img').value='';document.getElementById('link').value='';
 save();
}
function render(){
 document.getElementById('grid').innerHTML=p.length?p.map((x,i)=>`
  <div class="card">
   <img src="${x.image}">
   <div>
    <b style="font-size:12px">${x.name}</b>
    <div class="pr">₱${x.price}</div>
    <div style="font-size:10px;color:#a78bfa">3.5% = ₱${(x.price*0.035).toFixed(2)} kita</div>
    <a href="${x.link}" target="_blank" class="buy">Buy 🛒</a>
    <button onclick="p.splice(${i},1);save()" style="width:100%;margin-top:4px;background:#222;color:#666;border:0;padding:4px;border-radius:5px;font-size:10px">Delete</button>
   </div>
  </div>`).join(''):`<div style="grid-column:1/-1;padding:40px;text-align:center;color:#6b7280">Wala pa laman - Add ka na ng unang product sa taas!<br><br>💡 Tip: 10 products x ₱38 = ₱380/day na kahit wala ka ginagawa!</div>`;
}
render();
</script>
</body>
</html>
