<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tindahan ni Boss Kaiyah - Beast Tire</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui;background:#f6f6f6;color:#222}
.header{background:#ee4d2d;color:#fff;padding:14px;text-align:center;font-weight:800;font-size:18px;position:sticky;top:0;z-index:10}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px;max-width:900px;margin:auto}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.gallery{position:relative;aspect-ratio:1;background:#fff;overflow:hidden}
.gallery-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.gallery-track::-webkit-scrollbar{display:none}
.gallery-track img{width:100%;flex:0 0 100%;scroll-snap-align:start;object-fit:contain}
.dots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:5px}
.dots span{width:6px;height:6px;background:rgba(0,0,0,.2);border-radius:50%}
.dots span.active{background:#ee4d2d;width:18px}
.info{padding:10px}
.name{font-size:13px;line-height:1.3;height:36px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.price{color:#ee4d2d;font-weight:800;margin:6px 0;font-size:15px}
.btn{display:block;background:#ee4d2d;color:#fff;text-align:center;padding:9px;border-radius:8px;text-decoration:none;font-weight:700;font-size:13px}
.badge{position:absolute;top:8px;left:8px;background:#ffe600;color:#ee4d2d;font-size:10px;font-weight:800;padding:2px 6px;border-radius:4px}
</style>
</head>
<body>
<div class="header">🏍️ Tindahan ni Boss Kaiyah - Motorcycle Parts</div>
<div id="grid" class="grid"></div>
<script>
const API="https://opensheet.elk.sh/19KzFSe2smKM5k1qhQbynFF2kGJGga-yswjH4L8TX9tM/Sheet1";
async function load(){
 const res=await fetch(API); const data=await res.json();
 const grid=document.getElementById('grid'); grid.innerHTML='';
 data.forEach(p=>{
  if(!p.Name) return;
  let imgs=(p.images||p.Image||'').split(',').map(s=>s.trim()).filter(Boolean);
  if(imgs.length==0) imgs=['https://via.placeholder.com/300'];
  const card=document.createElement('div'); card.className='card';
  const dots=imgs.length>1?`<div class="dots">${imgs.map((_,i)=>`<span class="${i==0?'active':''}"></span>`).join('')}</div>`:'';
  card.innerHTML=`
   <div class="gallery">
    <div class="badge">${imgs.length} PICS</div>
    <div class="gallery-track" onscroll="updateDots(this)">
     ${imgs.map(src=>`<img src="${src}" loading="lazy" onerror="this.src='https://via.placeholder.com/300'">`).join('')}
    </div>
    ${dots}
   </div>
   <div class="info">
    <div class="name">${p.Name}</div>
    <div class="price">₱${p.Price}</div>
    <a class="btn" href="${p.Affiliate_link||p.Affiliate_Link||'#'}" target="_blank">🛒 Buy sa Shopee</a>
   </div>`;
  grid.appendChild(card);
 });
}
function updateDots(el){
 const idx=Math.round(el.scrollLeft/el.clientWidth);
 const dots=el.parentElement.querySelectorAll('.dots span');
 dots.forEach((d,i)=>d.classList.toggle('active',i==idx));
}
load();
</script>
</body>
</html>
