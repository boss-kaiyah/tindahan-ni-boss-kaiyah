<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tindahan ni Boss Kaiyah - Affiliate Store</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#0f0f0f;color:#fff}
header{background:linear-gradient(135deg,#a855f7,#ec4899);padding:20px;text-align:center;position:sticky;top:0;z-index:100}
header h1{font-size:28px;font-weight:900;letter-spacing:1px}
header p{opacity:.9;margin-top:5px}
.search{max-width:600px;margin:15px auto 0;display:flex;gap:10px}
.search input{flex:1;padding:12px 15px;border-radius:999px;border:none;outline:none;font-size:16px}
.search button{padding:12px 20px;border-radius:999px;border:none;background:#000;color:#fff;font-weight:700}
.filters{display:flex;gap:8px;overflow:auto;padding:15px;justify-content:center}
.filters button{padding:8px 16px;border-radius:999px;border:1px solid #333;background:#1a1a1a;color:#fff;white-space:nowrap}
.filters button.active{background:#a855f7;border-color:#a855f7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:15px;max-width:1200px;margin:0 auto}
.card{background:#1a1a1a;border-radius:16px;overflow:hidden;border:1px solid #2a2a2a;transition:.2s}
.card:hover{transform:translateY(-3px);border-color:#a855f7}
.card img{width:100%;height:160px;object-fit:cover;background:#222}
.card-body{padding:12px}
.card-body h3{font-size:14px;line-height:1.3;height:36px;overflow:hidden}
.price{color:#a855f7;font-weight:900;margin:8px 0;font-size:16px}
.buy{display:block;text-align:center;background:linear-gradient(135deg,#a855f7,#ec4899);color:#fff;padding:10px;border-radius:10px;text-decoration:none;font-weight:800;font-size:13px}
.loading{text-align:center;padding:60px;opacity:.6}
</style>
</head>
<body>
<header>
<h1>💜 Tindahan ni Boss Kaiyah</h1>
<p>Curated finds • Affiliate picks</p>
<div class="search">
<input id="searchInput" placeholder="Hanap ka ng product...">
<button onclick="loadProducts()">Search</button>
</div>
</header>

<div class="filters" id="filters">
<button class="active" onclick="filterCat('all')">All</button>
<button onclick="filterCat('Tech')">Tech</button>
<button onclick="filterCat('Fashion')">Fashion</button>
<button onclick="filterCat('Beauty')">Beauty</button>
<button onclick="filterCat('Home')">Home</button>
</div>

<div id="grid" class="grid"><div class="loading">Loading products from Google Sheets... ⏳</div></div>

<script>
const API = "https://opensheet.elk.sh/19KzFSe2smKM5k1qhQbynFF2kGJGga-yswjH4L8TX9tM/Sheet1";
let allProducts = [];
let activeCat = 'all';

async function loadProducts(){
  try{
    const res = await fetch(API);
    const data = await res.json();
    allProducts = data.filter(p => p.Name || p.name).map(p=>({
      name: p.Name || p.name || '',
      price: p.Price || p.price || '',
      image: p.Image || p.image || 'https://via.placeholder.com/400x400/a855f7/ffffff?text=Boss+Kaiyah',
      link: p.Affiliate_ling || p.affiliate_link || p.Affiliate_link || p.link || '#',
      category: p.Category || p.category || 'general'
    }));
    render();
  }catch(e){
    document.getElementById('grid').innerHTML = `<div class="loading">Wala pang laman sheet mo Parekoy! Mag-add ka ng product sa Google Sheets mo.<br><br>Headers: Name | Price | Image | Affiliate_ling | Category</div>`;
  }
}

function render(){
  const q = document.getElementById('searchInput').value.toLowerCase();
  let filtered = allProducts.filter(p=>{
    const matchSearch = p.name.toLowerCase().includes(q);
    const matchCat = activeCat==='all' || p.category.toLowerCase()===activeCat.toLowerCase();
    return matchSearch && matchCat;
  });
  
  if(filtered.length===0){
    document.getElementById('grid').innerHTML = `<div class="loading">Walang nakita sa "${q}" - try ibang keyword!</div>`;
    return;
  }
  
  document.getElementById('grid').innerHTML = filtered.map(p=>`
    <div class="card">
      <img src="${p.image}" onerror="this.src='https://via.placeholder.com/400/a855f7/ffffff?text=No+Image'">
      <div class="card-body">
        <h3>${p.name}</h3>
        <div class="price">₱${p.price}</div>
        <a class="buy" href="${p.link}" target="_blank">BUY NOW 🛒</a>
      </div>
    </div>
  `).join('');
}

function filterCat(cat){
  activeCat = cat;
  document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  render();
}

document.getElementById('searchInput').addEventListener('input', render);
loadProducts();
</script>
</body>
</html>
