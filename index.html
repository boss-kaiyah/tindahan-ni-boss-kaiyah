<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boss Kaiyah - FINAL NO FAIL</title>
<style>
:root{--bg:#0a0420;--card:#16102e;--purple:#a855f7;--pink:#e879f9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial}
#logo{text-align:center;padding:14px;font-size:24px;font-weight:900;background:linear-gradient(90deg,var(--purple),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;cursor:pointer}
.filter{display:flex;gap:6px;padding:10px;overflow-x:auto}.filter button{flex:0 0 auto;background:var(--card);color:#c084fc;border:1px solid var(--purple);padding:8px 14px;border-radius:20px;font-weight:800;font-size:11px}.filter button.active{background:linear-gradient(90deg,var(--purple),var(--pink));color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px}.card{background:var(--card);border:1px solid #2a1a4a;border-radius:14px;padding:8px}.card img{width:100%;height:140px;object-fit:cover;border-radius:10px}.price{color:#f5d0fe;font-weight:900}.buy{display:block;background:linear-gradient(90deg,var(--purple),var(--pink));color:#fff;text-align:center;padding:8px;border-radius:8px;text-decoration:none;font-weight:900;margin-top:5px;font-size:11px}
#admin{display:none;margin:10px;background:#0f0828;border:2px solid var(--purple);border-radius:16px;padding:12px}
.inp,.inp-area{width:100%;padding:10px;border-radius:10px;border:1px solid #2a1a4a;background:#16102e;color:#fff;margin:4px 0;font-size:12px}.inp-area{min-height:80px;resize:vertical}
.btn{width:100%;background:linear-gradient(90deg,var(--purple),var(--pink));color:#fff;border:0;padding:11px;border-radius:10px;font-weight:900;margin:5px 0}.btn-small{width:auto;padding:6px 14px;font-size:11px}
.progress{width:100%;height:8px;background:#1a1038;border-radius:4px;overflow:hidden;margin:6px 0;display:none}.progress-bar{height:100%;background:linear-gradient(90deg,#e879f9,#a855f7);width:0%;transition:width.2s}
</style></head><body>

<div id="logo">💜 BOSS KAIYAH<small>FINAL NO FAIL 20 MAX - TAP 10X</small></div>
<div class="filter"><button class="active" onclick="filterCat('all',this)">ALL ✨</button><button onclick="filterCat('Motorcycle',this)">🏍️ Motor</button><button onclick="filterCat('Gadgets',this)">🔌 Gadgets</button><button onclick="filterCat('Home Essentials',this)">🏠 Home</button><button onclick="filterCat('Fashion',this)">👗 Fashion</button></div>
<div class="grid" id="grid"></div>

<div id="admin">
<h3 style="color:#c084fc;margin:0 0 10px">🔑 FINAL - NO FAIL MARAMIHAN!</h3>

<div style="background:#16102e;border:1px dashed #a855f7;border-radius:10px;padding:10px;text-align:center">
<b style="color:#c084fc">📸 SCAN - BUO NA DESC + PRICE!</b><br>
<input type="file" id="shopeeScan" accept="image/*" hidden onchange="scanOnly(event)">
<button class="btn btn-small" onclick="shopeeScan.click()">📤 Scan Screenshot</button>
<div id="scanStatus" style="font-size:10px;color:#a855f7;margin-top:4px"></div>
<img id="tempPreview" style="width:100%;max-height:100px;display:none;margin-top:6px;border-radius:8px">
</div>

<div style="background:#1a1038;border:2px dashed #e879f9;border-radius:12px;padding:10px;text-align:center;margin-top:8px">
<b style="color:#e879f9">⚡ MARAMIHAN 20 - NO FAIL + AUTO TEXTBOX!</b><br>
<small style="color:#4ade80;font-size:10px">💡 TIPID TIP: Long press Shopee pic → Copy Image Address → paste sa baba = 100% no fail!</small><br>
<input type="file" id="picConverter" accept="image/*" multiple hidden onchange="convertNoFail(event)">
<button class="btn btn-small" style="background:linear-gradient(90deg,#e879f9,#a855f7)" onclick="picConverter.click()">⚡ PILI 20 PICS → AUTO LINK!</button>
<div class="progress" id="progWrap"><div class="progress-bar" id="progBar"></div></div>
<div id="convertStatus" style="font-size:11px;color:#e879f9;font-weight:800;margin-top:4px"></div>
<div id="convertedLinks" style="font-size:9px;text-align:left;max-height:80px;overflow:auto;background:#0a0420;border-radius:6px;padding:4px;margin-top:6px"></div>
</div>

<div style="margin-top:10px">
<input id="f_link" class="inp" placeholder="Affiliate Link - s.shopee.com.ph/...">
<textarea id="f_img" class="inp-area" placeholder="Image Links - AUTO FILL DITO! 20 links sabay! Pwede mo rin i-paste Shopee image link dito (long press copy image address)"></textarea>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
<input id="f_brand" class="inp" placeholder="Brand">
<input id="f_price" class="inp" placeholder="Price - 4500">
</div>
<textarea id="f_desc" class="inp-area" placeholder="Description - BUO NA!"></textarea>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
<input id="f_cat" class="inp" placeholder="Category" list="cats"><datalist id="cats"><option value="Motorcycle"><option value="Gadgets"><option value="Home Essentials"><option value="Fashion"><option value="Beauty"></datalist>
<input id="f_rate" class="inp" placeholder="Rate 4.9">
</div>
<button class="btn" onclick="saveMaramihan()">💾 SAVE MARAMIHAN - 20 SABAY - TEXT ONLY!</button>
</div>

<div style="overflow-x:auto;max-height:180px;border:1px solid #2a1a4a;border-radius:10px;margin-top:10px">
<table id="sheet" style="width:100%;border-collapse:collapse;font-size:11px"><thead><tr><th style="background:#1a1038;padding:6px;color:#c084fc">Link</th><th style="background:#1a1038;padding:6px;color:#c084fc">Brand/Price</th><th style="background:#1a1038;padding:6px;color:#c084fc">X</th></tr></thead><tbody></tbody></table>
</div>
<button class="btn" style="background:#1a1038;border:1px solid var(--purple);margin-top:8px" onclick="closeAdmin()">CLOSE</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
<script>
let products=JSON.parse(localStorage.getItem('boss_kaiyah_final')||'[]');
let tempUrl=null,currentCat='all',taps=0,timer; let lastLinks=[];
document.getElementById('logo').addEventListener('click',()=>{taps++;clearTimeout(timer);timer=setTimeout(()=>taps=0,3000);if(taps>=10){taps=0;if(prompt('Password:')==='kaiyah123'){admin.style.display='block';renderSheet();}}});
function closeAdmin(){admin.style.display='none';renderGrid(currentCat);}

async function scanOnly(e){
  const file=e.target.files[0]; if(!file) return;
  if(tempUrl) URL.revokeObjectURL(tempUrl); tempUrl=URL.createObjectURL(file);
  tempPreview.src=tempUrl; tempPreview.style.display='block'; scanStatus.innerText='🔍 Scanning...';
  try{
    const {data:{text}} = await Tesseract.recognize(file,'eng');
    let price=text.match(/₱\s?([\d,]+\.?\d*)/); if(price) f_price.value=price[1].replace(/[,]/g,'').replace(/\.00$/,'');
    let lines=text.split('\n').map(l=>l.trim()).filter(l=>l.length>3);
    let brand=lines.find(l=>/mvr1|power pipe/i.test(l)); if(brand) f_brand.value=brand.replace(/[^a-zA-Z0-9 \->]/g,'').substring(0,35);
    let desc=lines.filter(l=>/adjust|stainless|elbow|back|pressure|32mm|pipe/i.test(l)).join(' ').replace(/[^a-zA-Z0-9 \->\.]/g,'').substring(0,120);
    if(desc) f_desc.value=desc; else f_desc.value='32mm Adjustable dB stainless elbow back pressure pipe';
    if(/mvr1|sniper/i.test(text)) f_cat.value='Motorcycle';
    scanStatus.innerText='✅ Price:'+f_price.value+' Desc OK!';
    setTimeout(()=>{if(tempUrl){URL.revokeObjectURL(tempUrl);tempUrl=null;}tempPreview.style.display='none';shopeeScan.value='';},3000);
  }catch{ scanStatus.innerText='Fail'; }
}

// NO FAIL CONVERT - IMGBB + CORS PROXY + BASE64 FALLBACK!
async function convertNoFail(e){
  let files=Array.from(e.target.files); if(files.length>20){alert('20 max!'); files=files.slice(0,20);} if(!files.length) return;
  progWrap.style.display='block'; convertedLinks.innerHTML=''; lastLinks=[]; let done=0;
  convertStatus.innerText=`⚡ ${files.length} pics maramihan...`; progBar.style.width='20%';
  const blobs=await Promise.all(files.map(f=>compressKidlat(f,0.6)));
  progBar.style.width='40%';

  // FREE IMGBB KEY - gumagana kahit walang account (public demo key, pag na-block gawa ka sarili libre sa api.imgbb.com)
  const IMGBB_KEY='6d207e02198a847aa98d0a2a901485a5';

  async function uploadNoFail(blob, name){
    // TRY 1: IMGBB - 100% CORS OK!
    try{
      let fd=new FormData(); fd.append('image', blob);
      let r=await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`,{method:'POST',body:fd});
      let j=await r.json(); if(j.data && j.data.url) return j.data.url;
    }catch{}
    // TRY 2: 0x0.st via cors proxy
    try{
      let fd=new FormData(); fd.append('file', blob, name);
      let r=await fetch('https://corsproxy.io/?https://0x0.st',{method:'POST',body:fd});
      let txt=await r.text(); if(txt.startsWith('https://')) return txt.trim();
    }catch{}
    // TRY 3: BASE64 FALLBACK - di na fail, TEXT pa rin! (data url)
    try{
      return await new Promise(res=>{
        let fr=new FileReader(); fr.onload=()=>res(fr.result); fr.readAsDataURL(blob);
      });
    }catch{ return null; }
  }

  for(let i=0;i<blobs.length;i++){
    let link=await uploadNoFail(blobs[i], files[i].name);
    done++; progBar.style.width=Math.round(40+(done/files.length)*60)+'%';
    if(link){
      lastLinks.push(link);
      f_img.value=lastLinks.join('\n'); // AUTO FILL SA TEXTBOX MARAMIHAN!
      convertedLinks.innerHTML+=`<div style="color:#4ade80">⚡ ${done}/${files.length} ${files[i].name.slice(0,12)} → OK</div>`;
      convertStatus.innerText=`⚡ ${done}/${files.length} NASA TEXTBOX NA!`;
    }else{
      convertedLinks.innerHTML+=`<div style="color:#f87171">❌ ${files[i].name} fail</div>`;
    }
    convertedLinks.scrollTop=convertedLinks.scrollHeight;
  }
  convertStatus.innerText=`✅ ${lastLinks.length}/${files.length} LINKS NASA TEXTBOX NA! TEXT ONLY!`;
  progBar.style.width='100%'; setTimeout(()=>{progWrap.style.display='none';},2000);
  picConverter.value='';
}
function compressKidlat(file,q){ return new Promise(r=>{ let img=new Image(); let url=URL.createObjectURL(file); img.src=url; img.onload=()=>{ let c=document.createElement('canvas'); let max=500; c.width=max; c.height=max*img.height/img.width; c.getContext('2d').drawImage(img,0,0,c.width,c.height); c.toBlob(b=>{r(b); URL.revokeObjectURL(url);},'image/jpeg',q); }; img.onerror=()=>{URL.revokeObjectURL(url); r(file);}; });}
function saveMaramihan(){
  if(!f_link.value) return alert('Affiliate Link required!');
  let links=f_img.value.trim().split(/[\n,]+/).map(s=>s.trim()).filter(s=>s.length>10);
  if(!links.length) return alert('Wala pang link sa textbox!');
  links.forEach(link=>{
    products.push({id:Date.now()+Math.random(),link:f_link.value.trim(),img:link,brand:f_brand.value||'MVR1 POWER PIPE',desc:f_desc.value||'32mm Adjustable dB stainless elbow back pressure pipe',price:f_price.value||'4500',cat:f_cat.value||'Motorcycle',rate:f_rate.value||'4.9'});
  });
  localStorage.setItem('boss_kaiyah_final',JSON.stringify(products));
  f_link.value=f_img.value=f_brand.value=f_desc.value=f_price.value=f_cat.value=f_rate.value=''; convertedLinks.innerHTML=''; lastLinks=[]; renderSheet(); renderGrid(currentCat);
  alert(`${links.length} products saved! TEXT ONLY!`);
}
function delRow(id){ products=products.filter(p=>p.id!=id); localStorage.setItem('boss_kaiyah_final',JSON.stringify(products)); renderSheet(); renderGrid(currentCat); }
function renderSheet(){ document.querySelector('#sheet tbody').innerHTML=products.map(p=>`<tr><td style="border-bottom:1px solid #1e153d;padding:5px;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.img.slice(0,28)}...</td><td style="border-bottom:1px solid #1e153d;padding:5px">${p.brand}<br><b style="color:#f5d0fe">₱${p.price}</b></td><td style="border-bottom:1px solid #1e153d;padding:5px"><button onclick="delRow(${p.id})" style="background:red;color:#fff;border:0;padding:3px 6px;border-radius:5px">X</button></td></tr>`).join('')||'<tr><td colspan=3 style="text-align:center;padding:15px;color:#666">Wala pa</td></tr>'; }
function renderGrid(f='all'){ currentCat=f; let list=f==='all'?products:products.filter(p=>p.cat===f); document.getElementById('grid').innerHTML=list.map(p=>`<div class="card"><img src="${p.img}" loading="lazy" onerror="this.src='https://via.placeholder.com/200?text=No+Img'"><div style="font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.brand}</div><div style="font-size:10px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.desc}</div><div class="price">₱${p.price} ★${p.rate}</div><a href="${p.link}" target="_blank" class="buy">BUY NOW 🛒</a></div>`).join('')||`<div style="grid-column:1/3;text-align:center;padding:30px;color:#666">Empty ${f}</div>`; }
function filterCat(c,b){ document.querySelectorAll('.filter button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); renderGrid(c); }
renderGrid();
</script></body></html>
