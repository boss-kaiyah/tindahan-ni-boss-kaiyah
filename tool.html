<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOSS KAIYAH - AUTO FILL V4</title>
<style>body{font-family:system-ui;background:#0a0420;color:#fff;padding:14px}input,textarea{width:100%;padding:12px;border-radius:12px;background:#140a2e;color:#fff;border:1px solid #a855f7;margin:6px 0}button{width:100%;padding:14px;border-radius:12px;background:#a855f7;color:#fff;font-weight:800;border:0;margin:6px 0} .card{background:#1a1038;border-radius:12px;padding:12px;margin-top:10px;border:1px solid #a855f722} b{color:#c084fc}</style></head>
<body>
<h3>⚡ AUTO FILL V4 - Short Link OK na!</h3>
<input id="slink" placeholder="1. Paste Short Link dito: s.shopee.ph/XXXX">
<button onclick="resolve()">2. RESOLVE TO LONG LINK & GET DETAILS</button>
<div id="out"></div>
<textarea id="img" placeholder="3. Paste postimg.cc direct link dito (https://i.postimg.cc/....)"></textarea>
<button onclick="makeRow()">4. GENERATE PANG-PASTE SA GOOGLE SHEET</button>
<div id="row"></div>
<script>
let shop='',item='',longUrl='',name='',price='';
async function resolve(){
 let short=document.getElementById('slink').value.trim();
 if(!short) return alert('Paste short link muna!');
 document.getElementById('out').innerHTML='⏳ Ni-resolve ko... (10 sec)';
 try{
  let api=`https://api.allorigins.win/get?url=${encodeURIComponent(short)}`;
  let r=await fetch(api); let j=await r.json();
  let m=j.contents.match(/-i\.(\d+)\.(\d+)/);
  if(!m) throw 'Di ma-resolve';
  shop=m[1]; item=m[2];
  let found=j.contents.match(/https:\/\/shopee\.ph\/[^"]+-i\.\d+\.\d+[^"]*/);
  longUrl=found?found[0]:short;
  document.getElementById('out').innerHTML=`✅ Resolved! Shop: ${shop} Item: ${item}<br>⏳ Getting name/price...`;
  let api2=`https://shopee.ph/api/v4/item/get?itemid=${item}&shopid=${shop}`;
  let r2=await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(api2)}`);
  let d=(await r2.json()).data;
  name=d.name; price=Math.round(d.price/100000);
  document.getElementById('out').innerHTML+=`<div class=card><b>Name:</b> ${name}<br><b>Price:</b> ₱${price}<br><b>Rating:</b> ${d.item_rating?.rating_star||4.8}<br><br>Long URL ready!</div>`;
 }catch(e){ document.getElementById('out').innerHTML='❌ Error: '+e+'<br>Tip: Sa Shopee app, Share > Copy Link > yung mahaba kunin mo.'; }
}
function makeRow(){
 let img=document.getElementById('img').value.trim();
 if(!name) return alert('I-resolve mo muna short link!');
 if(!img) img='https://i.postimg.cc/placeholder.jpg';
 let desc=`Tubeless • 110/70-17 • 120/70-17 • 130/70-17`;
 let row=`${longUrl}\t${img}\t${name}\t${desc}\t${price}`;
 document.getElementById('row').innerHTML=`<div class=card><b>✅ COPY MO ITO - TAPOS PASTE SA GOOGLE SHEET ROW:</b><br><textarea style="height:120px">${row}</textarea><br><small>Paano paste: Open Sheets App > Hanap bakanteng Row (A,B,C,D,E) > Long press A > Paste > Automatic hahati sa 5 columns!</small><br><br><button onclick="navigator.clipboard.writeText('${row.replace(/'/g,"\\'")}')">📋 COPY ROW</button></div>`;
}
</script>
</body></html>
