<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tindahan ni Boss Kaiyah</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#0a0420;color:#fff}
.header{background:linear-gradient(135deg,#7c3aed,#a855f7);padding:18px;text-align:center;font-weight:900;font-size:20px;position:sticky;top:0;z-index:10}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:12px}
@media(max-width:768px){.grid{grid-template-columns:repeat(2,1fr)}} 
@media(max-width:480px){.grid{grid-template-columns:1fr}}
.card{background:#1a1038;border-radius:16px;overflow:hidden;border:1px solid #a855f722;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#140a2e}
.info{padding:10px;flex:1;display:flex;flex-direction:column}
.brand{font-weight:800;font-size:14px;line-height:1.2;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.desc{font-size:11px;color:#c084fc99;margin:4px 0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:30px}
.meta{display:flex;gap:8px;align-items:center;font-size:11px;color:#fbbf24;margin:4px 0}
.sold{color:#9ca3af}
.price{color:#a855f7;font-weight:900;font-size:16px;margin-top:auto}
.btn{background:#a855f7;color:#fff;text-align:center;padding:10px;border-radius:10px;text-decoration:none;font-weight:800;margin-top:8px;display:block}
.loading{text-align:center;padding:40px;color:#a855f7}
</style>
</head>
<body>
<div class="header">💜 TINDAHAN NI BOSS KAIYAH</div>
<div id="grid" class="grid"><div class="loading">⏳ Loading products...</div></div>

<script>
const SHEET_ID = '1aBcDeFgHiJkLmNoPqRsTuVwXyZ'; // PALITAN MO NG SHEET ID MO PAREKOY!
const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

async function load(){
 try{
  let r = await fetch(SHEET_URL);
  let t = await r.text();
  let j = JSON.parse(t.substr(47).slice(0,-2));
  let rows = j.table.rows;
  let html='';
  rows.slice(1).forEach(row=>{
    let A = row.c[0]?.v || ''; // Affiliate_link
    let B = row.c[1]?.v || ''; // images
    let C = row.c[2]?.v || ''; // Brand
    let D = row.c[3]?.v || ''; // Discription
    let E = row.c[4]?.v || '4.8'; // rate
    let F = row.c[5]?.v || '0'; // Sold
    let G = row.c[6]?.v || ''; // Price
    if(!A && !B) return;
    let stars = '★'.repeat(Math.round(parseFloat(E)||5));
    html+=`<div class="card">
      <img src="${B}" onerror="this.src='https://via.placeholder.com/300?text=No+Image'">
      <div class="info">
        <div class="brand">${C}</div>
        <div class="desc">${D}</div>
        <div class="meta"><span>${stars} ${E}</span><span class="sold">• ${F} Sold</span></div>
        <div class="price">₱${G}</div>
        <a class="btn" href="${A}" target="_blank">BUY NOW 🛒</a>
      </div>
    </div>`;
  });
  document.getElementById('grid').innerHTML = html || '<div class=loading>Walang products - mag add ka sa Sheet!</div>';
 }catch(e){ document.getElementById('grid').innerHTML = '<div class=loading>❌ Error: Check mo SHEET_ID at i-Publish mo Sheet (File > Share > Publish to web)</div>'; }
}
load();
</script>
</body>
</html>
